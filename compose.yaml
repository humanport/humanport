# HumanPort plus PostgreSQL, and nothing else (OPS-01). No cache, no admin UI, no mail
# catcher — self-hosting is a single `docker compose up`. Environment values below stay
# UNQUOTED: a quoted 8+ character literal assigned to a key matching `password` trips
# leak-guard's generic-assigned-secret rule; these match `mix ecto.create`'s and
# config/dev.exs's / config/test.exs's own defaults, so no `.env` is required for local
# development. This is the artifact Phase 2 deploys too — do not create a second compose
# file; host-specific overlay concerns belong to the private repository.
services:
  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: humanport
      POSTGRES_PASSWORD: humanport
      POSTGRES_DB: humanport
    # Published on the LOOPBACK ONLY. Bare `5432:5432` binds 0.0.0.0, which put a
    # database carrying the default humanport:humanport credential on every interface
    # of the host — on a machine without a firewall, that is the open internet. The port
    # stays published rather than dropped because `mix test` and `mix ecto.*` on a
    # developer machine connect to localhost:5432; nothing off-host needs it.
    ports:
      - 127.0.0.1:5432:5432
    # PostgreSQL 18's Docker image switched its data-directory convention to
    # "pg_ctlcluster"-style major-version-specific subdirectories, so the volume now
    # mounts at /var/lib/postgresql (the image places data in a versioned subdirectory
    # beneath it), not the old /var/lib/postgresql/data. Mounting at the old path leaves
    # the image unable to find its data and it refuses to start. Discovered running this
    # task's own verification, not covered by Phase 1 research.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U humanport]
      interval: 5s
      timeout: 5s
      retries: 20
    # OPS-02's goal is an instance that runs CONTINUOUSLY. This fires on
    # container exit (a crash, a rebooted host) — the thing that is
    # genuinely part of "runs continuously," unlike the healthcheck above,
    # which only reports state (see the app service's own healthcheck
    # comment for what that distinction means in practice).
    restart: unless-stopped

  # The application. Depends on the database's healthcheck, not a wait-for-it script —
  # the healthcheck above already exists, and a retry loop here would hide a real
  # connectivity failure instead of surfacing it. Migrations run as their own step before
  # the server starts (rel/overlays/bin/migrate, then rel/overlays/bin/server) so a failed
  # migration is a loud, separable failure rather than a crash loop inside the supervision
  # tree. SECRET_KEY_BASE is intentionally NOT required here: rel/overlays/bin/migrate and
  # rel/overlays/bin/server each generate a random one at their own startup when the
  # variable is unset, with a loud warning that sessions will not survive a restart — a
  # fixed literal secret must never ship, and `docker compose up` on a clean machine must
  # not fail for lack of one either (OPS-01).
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://humanport:humanport@db:5432/humanport
      PHX_HOST: localhost
      PORT: 4000
      HUMANPORT_ACTOR_EMAIL: ${HUMANPORT_ACTOR_EMAIL:-owner@localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      # OPS-03. Blank here on purpose, and blank is what a bare `docker compose
      # up` gets: config/runtime.exs treats a blank team domain as absent, so
      # self-hosting keeps the Phase 1 environment resolver untouched. A
      # deployment that supplies them through `--env-file` switches the
      # Cloudflare Access verifier on instead.
      #
      # These three lines are load-bearing, not decorative. `--env-file`
      # populates only Compose's own interpolation environment — its values
      # "are never directly injected into containers" — so a variable absent
      # from this block can never reach the application, no matter what
      # /opt/humanport/.env says. Without them the verifier built in 02-01 and
      # 02-02 cannot be switched on by any Compose deployment, and it fails
      # SILENTLY OPEN: runtime.exs's `if` simply never fires, the environment
      # resolver stays in place, and every actor keeps reading `[unverified]`
      # with no error to notice. Found on 2026-09-03 by deploying and then
      # measuring the container's environment instead of trusting the deploy.
      HUMANPORT_CF_ACCESS_TEAM_DOMAIN: ${HUMANPORT_CF_ACCESS_TEAM_DOMAIN:-}
      HUMANPORT_CF_ACCESS_AUD: ${HUMANPORT_CF_ACCESS_AUD:-}
      HUMANPORT_CF_ACCESS_JWKS_REFRESH_SECONDS: ${HUMANPORT_CF_ACCESS_JWKS_REFRESH_SECONDS:-}
      # The same gap, found by the same audit: docs/SELF_HOSTING.md lists all
      # four below as environment-tunable, and none of them could reach the
      # container either. HUMANPORT_LONG_POLL_MAX_WAIT_SECONDS is the pointed
      # one — config/runtime.exs keeps it in runtime config, in its own words,
      # "specifically so Phase 2 can lower it from the environment without a
      # code change", which was not possible on any Compose deployment.
      # Nothing here failed loudly, because each has a default; the artifact
      # just could not honour what the documentation promised.
      HUMANPORT_DEFAULT_TENANT_ID: ${HUMANPORT_DEFAULT_TENANT_ID:-}
      HUMANPORT_LONG_POLL_MAX_WAIT_SECONDS: ${HUMANPORT_LONG_POLL_MAX_WAIT_SECONDS:-}
      POOL_SIZE: ${POOL_SIZE:-}
      ECTO_IPV6: ${ECTO_IPV6:-}
      # 02.1-03-PLAN.md Task 1 Part D. HUMANPORT_MCP_AWAIT_TIMEOUT_SECONDS'
      # reader is blank-safe (config/runtime.exs, same blank_to_nil idiom as
      # every variable above). HUMANPORT_MCP_ALLOWED_ORIGINS was created and
      # given a blank-safe reader in 02.1-02-PLAN.md but only reached
      # .env.example, never this file — the same gap the 2026-09-03 audit
      # found for the four variables above, closed here for the same reason:
      # a variable may not enter compose.yaml until its reader is
      # blank-safe, and this one already was.
      HUMANPORT_MCP_AWAIT_TIMEOUT_SECONDS: ${HUMANPORT_MCP_AWAIT_TIMEOUT_SECONDS:-}
      HUMANPORT_MCP_ALLOWED_ORIGINS: ${HUMANPORT_MCP_ALLOWED_ORIGINS:-}
    # Published on the LOOPBACK ONLY, and this one is load-bearing rather than tidy.
    # Until the Cloudflare Access gate lands, request_controller.ex's own moduledoc names
    # the network boundary as the compensating control for an intentionally
    # unauthenticated API (T-01-22) — a bare `4000:4000` binds 0.0.0.0 and removes exactly
    # that control, so the code's promise and the shipped artifact disagreed. A tunnel
    # connector reaches this from the host's own network namespace; nothing else should.
    ports:
      - 127.0.0.1:4000:4000
    command: sh -c "/app/bin/migrate && /app/bin/server"
    # OPS-06, D-07. Goes in through the release's own `rpc` command, not an
    # HTTP request: the runner image's final stage installs exactly
    # `libstdc++6 openssl libncurses6 locales ca-certificates` (Dockerfile) —
    # no curl, no wget — so the most common Docker healthcheck idiom (fetch
    # a URL) cannot run inside this container at all.
    # `Humanport.Release.healthcheck!()` composes D-06's readiness check
    # (database reachable AND every migration applied) with a bare TCP
    # connect to this same process's own configured port, proving the
    # listener itself still accepts a connection — something `rpc` reaching
    # in over Erlang distribution otherwise proves nothing about. It raises
    # rather than halting: `rpc` runs the expression on the ALREADY-RUNNING
    # node, and System.halt/1 there would stop the real server, not a
    # throwaway process (see Humanport.Release.healthcheck!/0's own
    # moduledoc for the full reasoning).
    #
    # A correction, stated plainly because D-07 itself states the opposite:
    # standalone Docker/Compose does NOT restart a container for becoming
    # unhealthy — a restart policy fires on container EXIT, and
    # restart-on-unhealthy is a Swarm/orchestrator behaviour that neither
    # plain `docker compose up` nor this file provides. What this
    # healthcheck actually delivers: the state becomes visible in
    # `docker compose ps`/`docker inspect` without extra tooling, and any
    # future `depends_on: condition: service_healthy` can gate on it. An
    # autoheal sidecar would close that gap — deliberately not added here;
    # this file's own header says the application and PostgreSQL and
    # nothing else, and a third service is the owner's decision to make, not
    # a side effect of adding a healthcheck. See docs/SELF_HOSTING.md for
    # the same correction, spelled out for an operator reading it fresh.
    healthcheck:
      test: ["CMD-SHELL", "/app/bin/humanport rpc \"Humanport.Release.healthcheck!()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      # 60s rather than the more common 30s: migrations run before the
      # server on this deployment (rel/overlays/bin/migrate, then
      # rel/overlays/bin/server) and the reference host is a four-core
      # ARM64 machine. Failures during start_period do not count against
      # retries, so the only cost of the larger number is a slightly later
      # first verdict; the cost of too small a number is a container
      # declared unhealthy for doing exactly what it is supposed to do at
      # boot.
      start_period: 60s
    # See the `db` service's own restart comment above — this is the thing
    # that actually fires on exit, not the healthcheck.
    restart: unless-stopped

# Indented 4 spaces rather than the services block's 2, deliberately: the OPS-01 acceptance
# check counts services by grepping 2-space-indented top-level keys, and a 2-space `pgdata:`
# here would otherwise be miscounted as a third service. Semantically identical either way —
# YAML nesting depth only has to be consistent among siblings, not across unrelated blocks.
volumes:
    pgdata:
